steps:
  - key: "docker"
    label: ":docker: Build, Login & Push app/server"
    commands:
      - echo "Building Docker image"
      - docker build --tag packages.buildkite.com/tam-sandbox/ao-bk-playground/app:latest ./app
      - docker build --tag packages.buildkite.com/tam-sandbox/ao-bk-playground/server:latest ./server

      - echo "Logging into Buildkite Package Registry using OIDC"
      - buildkite-agent oidc request-token --audience "https://packages.buildkite.com/tam-sandbox/ao-bk-playground" --lifetime 300 | docker login packages.buildkite.com/tam-sandbox/ao-bk-playground --username buildkite --password-stdin
      
      - echo "Pushing Docker image to Buildkite Package Registry"
      - docker push packages.buildkite.com/tam-sandbox/ao-bk-playground/app:latest
      - docker push packages.buildkite.com/tam-sandbox/ao-bk-playground/server:latest 



