steps:
  - label: ":docker: Check Docker"
    command: |
      command -v docker
      docker version
      docker compose version

  - label: ":docker: Validate Compose"
    command: "docker compose config"
  
  - label: ":docker: Build images"
    key: "build-images"
    command: "docker compose build"

  - label: ":docker: Smoke test"
    key: "compose-smoke-test"
    depends_on: "build-images"
    concurrency: 1 ## limits on how many builds can run concurrently for this step
    concurrency_group: "nasa-image-app" ## the limits are tied to this group name, so all builds with the same group name will be limited
    secrets:
      API_TOKEN: NASA_API_TOKEN
    command: |
      set -euo pipefail

      docker compose up --build --detach
      docker compose down --remove-orphans
