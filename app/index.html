<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="View NASA's Astronomy Picture of the Day."
    >
    <title>NASA Image Explorer</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./render.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Beyond our atmosphere</p>
        <h1>NASA image of the day</h1>
        <p class="intro">
          A fresh window into space, fetched from NASA's astronomy archive.
        </p>
        <form id="apod-date-form" class="date-search">
          <label for="apod-date">Explore another day</label>
          <div class="date-controls">
            <input
              id="apod-date"
              name="date"
              type="date"
              min="1995-06-16"
              aria-describedby="date-hint"
            >
            <button type="submit">View image</button>
          </div>
          <p id="date-hint" class="date-hint">
            Choose any date from June 16, 1995 through today.
          </p>
        </form>
      </header>

      <section class="image-card" aria-labelledby="image-heading">
        <div class="image-frame">
          <div id="image-loading" class="loading-state" role="status">
            <span class="orbit" aria-hidden="true"></span>
            <span>Contacting mission control…</span>
          </div>
          <img
            id="nasa-image"
            alt="NASA Astronomy Picture of the Day"
            hidden
          >
        </div>

        <div class="card-footer">
          <div class="image-details">
            <div class="meta-row">
              <p class="caption-label">Today's view</p>
              <time id="image-date" datetime=""></time>
            </div>
            <h2 id="image-heading">Astronomy Picture of the Day</h2>
            <p id="image-attribution" class="attribution" hidden></p>
            <p id="image-explanation" class="explanation"></p>
            <p id="image-error" class="error-message" role="alert"></p>
            <div class="actions">
              <a
                id="high-res-link"
                class="high-res-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                hidden
              >View high-resolution image <span aria-hidden="true">↗</span></a>
              <button id="retry-image" type="button">Refresh image</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
