apiVersion: v1
kind: Service
metadata:
  name: {{ include "nasa-image.fullname" . }}-server
  labels:
    {{- include "nasa-image.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nasa-image.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
